name: Train Cutilytics MVP model

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  train:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install training dependencies
        run: pip install tensorflow pandas scikit-learn pillow
      - name: Train person-safe capture-angle model
        run: python train_pose_mvp.py --data-dir . --csv 'Facial Skin Condition Dataset.csv' --output-dir models --epochs 12
      - name: Save model artifacts
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add models/
          git diff --cached --quiet || git commit -m 'Add trained Cutilytics MVP model'
          git push
